name: validate
on:
  schedule:
    - cron: '0 0 * * 0' # every Sunday at midnight
  push:
    branches: ['main']
  pull_request:
    branches: ['*']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
concurrency:
  group: ${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
  validate:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: RageAgainstThePixel/setup-ovr-platform-util
        id: setup-ovr-platform-util
        uses: ./
      - run: 'ovr-platform-util version'
      - run: |
          echo "path: ${{ steps.setup-ovr-platform-util.outputs.path }}"
          echo "version: ${{ steps.setup-ovr-platform-util.outputs.version }}"
          "$OVR_PLATFORM_UTIL_PATH" version
        shell: bash
