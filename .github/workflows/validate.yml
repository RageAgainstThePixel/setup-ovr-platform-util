name: validate
on:
  schedule:
    - cron: '0 0 * * 0' # every Sunday at midnight
  push:
    branches: ['main']
  pull_request:
    branches: ['*']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
concurrency:
  group: ${{ github.ref }}

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    # docs-only pull requests skip validation; validate-result still reports for them
    uses: RageAgainstThePixel/workflows/.github/workflows/detect-changes.yml@main
  test:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
  validate:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: RageAgainstThePixel/setup-ovr-platform-util
        id: setup-ovr-platform-util
        uses: ./
      - run: 'ovr-platform-util version'
      - run: |
          echo "path: ${{ steps.setup-ovr-platform-util.outputs.path }}"
          echo "version: ${{ steps.setup-ovr-platform-util.outputs.version }}"
          "$OVR_PLATFORM_UTIL_PATH" version
        shell: bash
  # the one required check: passes when every job passed or was skipped for a docs-only change
  validate-result:
    needs: [changes, test, validate]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
